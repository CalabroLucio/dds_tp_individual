<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="AI Ticket It — Entradas a un click">
  <defs>
    <radialGradient id="brillo" cx="22%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#6BD43F" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#0E0F12" stop-opacity="0"/>
    </radialGradient>
    <mask id="troquel">
      <rect x="0" y="0" width="1200" height="380" fill="white"/>
      <circle cx="263" cy="96" r="14" fill="black"/>
      <circle cx="263" cy="284" r="14" fill="black"/>
    </mask>
  </defs>

  <rect width="1200" height="380" rx="28" fill="#0E0F12"/>
  <rect width="1200" height="380" rx="28" fill="url(#brillo)"/>

  <!-- Logo: entrada troquelada -->
  <g mask="url(#troquel)">
    <rect x="110" y="96" width="300" height="188" rx="26" fill="#6BD43F"/>
  </g>
  <line x1="263" y1="118" x2="263" y2="262" stroke="#0B1A05" stroke-width="5" stroke-dasharray="12 12" stroke-linecap="round"/>
  <text x="186" y="216" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="70" font-weight="800" fill="#0B1A05">AI</text>
  <path d="M310 190 l20 22 l42 -52" fill="none" stroke="#0B1A05" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Marca -->
  <text x="470" y="198" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="96" font-weight="800" fill="#F3F5F7">Ticket <tspan fill="#6BD43F">It</tspan></text>
  <text x="474" y="252" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="500" letter-spacing="9" fill="#9BA3AE">ENTRADAS A UN CLICK</text>

  <!-- Línea troquelada inferior -->
  <line x1="470" y1="300" x2="1090" y2="300" stroke="#2C3039" stroke-width="3" stroke-dasharray="10 10"/>
  <text x="474" y="336" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#9BA3AE">TP individual · Desarrollo de Software · UTN FRBA · 2C 2026</text>
</svg>
